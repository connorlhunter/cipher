name: Bug
description: Report a reproducible Cipher problem.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private messages, Cipher phrases, or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Apple Silicon macOS
        - Windows 11 x64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
