name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            native:
              - 'src/**'
              - 'src-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'package.json'
              - 'bun.lock'
              - 'scripts/run-tauri.ts'
              - 'scripts/check-toolchain.ts'
              - 'infra/**'
              - '.github/workflows/**'

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run naming:check
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        run: bun scripts/change-naming.ts --pull-request-title
        env:
          CIPHER_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
      - name: Require linked issue
        if: github.event_name == 'pull_request'
        run: bun scripts/issue-link.ts --pull-request-body
        env:
          CIPHER_PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          CIPHER_PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
      - run: bun audit --audit-level=high
      - run: bun x prettier --check . --ignore-unknown
      - run: bun x eslint .
      - run: bun x tsgo --build --pretty false
      - run: bun run test:frontend
      - run: bun run web:build

  native:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_CHECKS_REQUIRED: ${{ github.event_name == 'push' || needs.changes.outputs.native == 'true' }}
    steps:
      - name: Report native check scope
        if: env.NATIVE_CHECKS_REQUIRED != 'true'
        run: echo "Native build steps are not required for this change; preserving the platform check context."
      - uses: actions/checkout@v7
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: rustup toolchain install
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
        with:
          shared-key: ${{ runner.os }}-cipher
      - run: bun install --frozen-lockfile --ignore-scripts
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
      - run: npm --prefix infra ci --ignore-scripts
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
      - name: Verify State-stack auth contract
        if: env.NATIVE_CHECKS_REQUIRED == 'true'
        run: npm --prefix infra run test:state-foundations
      - name: Install Rust dependency checker
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Install Rust coverage tool
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Check native toolchain
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: bun run toolchain:check
      - name: Check Rust dependencies
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: cargo deny check
      - name: Check Rust formatting
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: cargo fmt --check
      - name: Lint Rust workspace
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Rust documentation
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run desktop Rust tests
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'Windows'
        run: cargo test -p cipher-desktop --bin cipher-desktop --locked
      - name: Run Rust coverage gate
        if: env.NATIVE_CHECKS_REQUIRED == 'true' && runner.os == 'macOS'
        run: bun run coverage:rust
      - run: bun run desktop:build
        if: env.NATIVE_CHECKS_REQUIRED == 'true'

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm --prefix infra ci --ignore-scripts
      - run: npm --prefix infra audit --audit-level=high
      - run: npm --prefix infra run typecheck
      - run: npm --prefix infra run test
      - run: set -a && . ./.env.example && set +a && CDK_DEFAULT_ACCOUNT=123456789012 npm --prefix infra run synth
