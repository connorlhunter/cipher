name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level=high
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: bun x prettier --check . --ignore-unknown
      - run: bun x eslint .
      - run: bun run typecheck
      - run: bun run test:frontend
      - run: bun run web:build

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: rustup toolchain install
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run toolchain:check
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: bun run desktop:build

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm --prefix infra ci --ignore-scripts
      - run: npm --prefix infra audit --audit-level=high
      - run: npm --prefix infra run typecheck
      - run: set -a && . ./.env.example && set +a && CDK_DEFAULT_ACCOUNT=123456789012 npm --prefix infra run synth
