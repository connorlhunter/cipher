name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run naming:check
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        run: bun scripts/change-naming.ts --pull-request-title
        env:
          CIPHER_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
      - run: bun audit --audit-level=high
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: bun x prettier --check . --ignore-unknown
      - run: bun x eslint .
      - run: bun x tsgo --build --pretty false
      - run: bun run test:frontend
      - run: bun run web:build

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: rustup toolchain install
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: bun run toolchain:check
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --locked
      - name: Run Rust coverage gate
        if: runner.os == 'macOS'
        run: bun run coverage:rust
      - run: cargo build --workspace --release --locked
      - run: bun run desktop:build

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm --prefix infra ci --ignore-scripts
      - run: npm --prefix infra audit --audit-level=high
      - run: npm --prefix infra run typecheck
      - run: npm --prefix infra run test
      - run: set -a && . ./.env.example && set +a && CDK_DEFAULT_ACCOUNT=123456789012 npm --prefix infra run synth
