name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level=high
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories licenses sources
      - run: bun x prettier --check . --ignore-unknown
      - run: bun x eslint .
      - run: bun run typecheck
      - run: bun run test:frontend
      - run: bun run web:build

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run toolchain:check
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: bun run desktop:build
