[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Tauri requires urlpattern; review whenever Tauri updates." },
  { id = "RUSTSEC-2025-0080", reason = "Tauri requires urlpattern; review whenever Tauri updates." },
  { id = "RUSTSEC-2025-0081", reason = "Tauri requires urlpattern; review whenever Tauri updates." },
  { id = "RUSTSEC-2025-0098", reason = "Tauri requires urlpattern; review whenever Tauri updates." },
  { id = "RUSTSEC-2025-0100", reason = "Tauri requires urlpattern; review whenever Tauri updates." },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
