[package]
name = "cipher-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
aws-config = { version = "^1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodb = { version = "^1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
cipher-types = { path = "../../crates/cipher-types", version = "^0.1.0-prealpha.8" }
jsonwebtoken = { version = "^10.4.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "^0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "^1.24.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "^0.1.5"
tower = { version = "^0.5.3", features = ["util"] }
