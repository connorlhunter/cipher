[package]
name = "cipher-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
cipher-types = { path = "../crates/cipher-types", version = "^0.1.0-prealpha.6" }
cipher-native-transport = { path = "../crates/cipher-native-transport", version = "^0.1.0-prealpha.6" }
keyring-core = "^1.0.0"
serde.workspace = true
sha2 = "^0.10.9"
tauri = { version = "^2.11.5", features = [] }
zeroize = "^1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "^1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "^1.1.0", default-features = false }

[dev-dependencies]
serde_json = "^1.0.151"
